name: Verify templates
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test
      - run: bun audit
  presets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [personal, organization]
        frontend: [react, tanstack]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun run setup --mode ${{ matrix.mode }} --frontend ${{ matrix.frontend }}
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run test
      - run: bun run build
      - run: bun audit
